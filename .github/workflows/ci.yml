name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install
        run: |
          python -m pip install -r requirements.txt
          npm ci --prefix extractor/code_tree_exporter/extractors/angular-extractor

      - name: Extractor tests (incl. golden snapshots)
        run: python -m unittest discover -s extractor/tests -t extractor

      - name: Read side tests (codemap, MCP server, web API)
        run: |
          python -m unittest discover -s codemap/tests -t .
          python -m unittest discover -s codemap/mcp/tests -t .
          python -m unittest discover -s web/tests -t .

      - name: Demo extract (all sources)
        run: python -m codemap extract

      - name: Corpus quality report (all sources, informational)
        run: |
          python tools/corpus-gen generate --out "$RUNNER_TEMP/corpus" --size m
          python -m code_tree_exporter extract --config "$RUNNER_TEMP/corpus/config.json"
          python tools/corpus-gen score-extract --corpus "$RUNNER_TEMP/corpus" | tee -a "$GITHUB_STEP_SUMMARY"
          python -m code_tree_exporter verify-oracle --graph "$RUNNER_TEMP/corpus/out" \
            --dependencies "$RUNNER_TEMP/corpus/truth/all_dependencies.csv" | tee -a "$GITHUB_STEP_SUMMARY"
          python tools/corpus-gen baseline --corpus "$RUNNER_TEMP/corpus" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Frontend build and tests
        working-directory: web/frontend
        run: |
          npm ci
          npm run test:graph
          npm run test:business
          npm run build

      # demo-full.json needs .NET, which a contributor may not have; CI records it once.
      - name: Record the .NET golden snapshot when it is missing
        if: hashFiles('testdata/golden/demo-full.json') == ''
        env:
          CODE_MAP_UPDATE_GOLDEN: "1"
        run: python -m unittest extractor.tests.test_golden_demo.GoldenDemoTests.test_all_sources
      - uses: actions/upload-artifact@v4
        if: hashFiles('testdata/golden/demo-full.json') != ''
        with:
          name: golden-snapshots
          path: testdata/golden/
