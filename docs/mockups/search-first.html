<title>Code Map Search First</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: giống màn hình hiện tại — panel trái (search → chi tiết node → viết/import nghiệp vụ) | canvas phải (graph, swimlane khi đã có nghiệp vụ) */
:root {
  color-scheme: dark;
  --bg: #0b1020; --surface: #111a2d; --surface-2: #17213a; --line: #24314f;
  --fg: #e6ebf5; --muted: #8b97b3; --accent: #f0a04b; --select: #4d8ef0;
  --ui: #5aa9f0; --api: #a58cf0; --logic: #8fa3c8; --data: #5cc98a; --ext: #ee7aa0; --rule: #e8b84a; --biz: #3fb8a8;
  --ok: #4cc38a; --warn: #e8b84a; --bad: #f2645a;
  --node-bg: #f3f5fa; --node-fg: #121a2e; --grid-dot: #1d2741;
  --s1: #3fb8a8; --s2: #e8b84a; --s3: #ee7aa0; --s4: #5aa9f0; --s5: #a58cf0;
  --font-body: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #eef1f7; --surface: #ffffff; --surface-2: #f4f6fb; --line: #d7ddea; --fg: #172036; --muted: #5d6883; --accent: #c86a12; --select: #1f6fd6;
    --ui: #1f74c4; --api: #6c4fd1; --logic: #4d5f85; --data: #1f8a52; --ext: #c2416d; --rule: #a87810; --biz: #138a7c;
    --ok: #1f8a52; --warn: #a87810; --bad: #c9362c; --node-bg: #ffffff; --node-fg: #172036; --grid-dot: #d3d9e6;
    --s1: #138a7c; --s2: #a87810; --s3: #c2416d; --s4: #1f74c4; --s5: #6c4fd1;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #eef1f7; --surface: #ffffff; --surface-2: #f4f6fb; --line: #d7ddea; --fg: #172036; --muted: #5d6883; --accent: #c86a12; --select: #1f6fd6;
  --ui: #1f74c4; --api: #6c4fd1; --logic: #4d5f85; --data: #1f8a52; --ext: #c2416d; --rule: #a87810; --biz: #138a7c;
  --ok: #1f8a52; --warn: #a87810; --bad: #c9362c; --node-bg: #ffffff; --node-fg: #172036; --grid-dot: #d3d9e6;
  --s1: #138a7c; --s2: #a87810; --s3: #c2416d; --s4: #1f74c4; --s5: #6c4fd1;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 13px; line-height: 1.45; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: var(--font-mono); font-size: 11.5px; }

.app { display: grid; grid-template-columns: 460px minmax(0, 1fr); height: 100%;
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }

/* ---------- Panel trái ---------- */
.left { border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.search { display: flex; align-items: center; gap: 8px; margin: 12px; padding: 6px 6px 6px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; padding: 4px 0; }
.search .btn { flex: none; }
.scroll { overflow-y: auto; padding: 0 12px 24px; display: grid; gap: 12px; align-content: start; min-height: 0; flex: 1; }
.hint { color: var(--muted); font-size: 12px; margin: 0; }
.results { display: grid; gap: 6px; }
.res { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; text-align: left; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; }
.res:hover { border-color: var(--muted); }
.res .nm { font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
.res .meta { grid-column: 2 / -1; font-size: 11px; color: var(--muted); }
.res .flowtag { font-size: 10.5px; color: var(--biz); white-space: nowrap; }
.tbadge { font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--lc); color: var(--lc); white-space: nowrap; }

.box { border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 12px 14px; display: grid; gap: 8px; }
.box.head { border-left: 3px solid var(--select); }
.box h2 { margin: 0; font-size: 18px; font-family: var(--font-mono); font-weight: 600; overflow-wrap: anywhere; }
.box h3 { margin: 0; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.box h4 { margin: 0; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.src { font-size: 10px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.src.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, transparent); }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 3px 10px; margin: 0; font-size: 12px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.empty { border: 1.5px dashed var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; text-align: left; }
.empty b { font-size: 13.5px; }
.empty p { margin: 0; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 5px 11px; cursor: pointer; font-size: 12.5px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
.btn.sm { padding: 2px 8px; font-size: 11.5px; }
.btn.ghost { background: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.back { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0; font-size: 12px; justify-self: start; }

/* editor */
.field { display: grid; gap: 4px; }
.field label { font-size: 11px; color: var(--muted); font-weight: 600; }
.field input, .field textarea, .field select { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 7px; padding: 6px 9px; }
.field textarea { resize: vertical; min-height: 54px; }
.step { border: 1px solid var(--line); border-left: 4px solid var(--sc); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; background: var(--surface); cursor: pointer; }
.step.active { box-shadow: 0 0 0 2px color-mix(in srgb, var(--sc) 70%, transparent); }
.step .sh { display: flex; gap: 8px; align-items: center; }
.step .no { font-family: var(--font-mono); font-size: 11px; color: var(--sc); font-weight: 700; }
.step .sh input { flex: 1; min-width: 0; border: 1px solid transparent; background: none; border-radius: 6px; padding: 3px 6px; font-weight: 600; }
.step .sh input:hover, .step .sh input:focus { border-color: var(--line); background: var(--bg); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.nchip { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 10.5px; border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px 2px 7px; background: var(--surface-2); }
.nchip i { width: 7px; height: 7px; border-radius: 2px; background: var(--lc); }
.nchip button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 3px; }
.assign-hint { font-size: 11.5px; color: var(--sc); }
.rule { display: grid; gap: 6px; padding: 8px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }
.rule-v { display: grid; grid-template-columns: 14px 1fr; gap: 6px; font-size: 12px; }
.rule-v::before { content: "◆"; color: var(--rule); font-size: 10px; line-height: 1.8; }
.rule-v span small { display: block; color: var(--muted); font-family: var(--font-mono); font-size: 10.5px; }
textarea.yaml { width: 100%; min-height: 320px; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.5; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px; resize: vertical; white-space: pre; }
.check { display: grid; gap: 4px; font-size: 12px; }
.check div { display: grid; grid-template-columns: 16px 1fr; gap: 6px; }
.check .y::before { content: "✓"; color: var(--ok); font-weight: 700; }
.check .n::before { content: "✕"; color: var(--bad); font-weight: 700; }
.check .e { color: var(--bad); }
.check code { overflow-wrap: anywhere; }
.alert { border: 1px dashed var(--warn); border-radius: 8px; padding: 8px 10px; background: color-mix(in srgb, var(--warn) 8%, transparent); font-size: 12px; }
pre.out { margin: 0; padding: 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); overflow-x: auto; font-family: var(--font-mono); font-size: 11px; line-height: 1.5; max-height: 360px; }

/* ---------- Canvas phải ---------- */
.right { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.cbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--surface); font-size: 12px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--bg); }
.seg button { border: 0; background: none; padding: 4px 11px; border-radius: 6px; cursor: pointer; font-size: 12px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line); }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; margin-left: auto; }
.legend span { display: inline-flex; gap: 5px; align-items: center; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--sc); }
.canvas-wrap { flex: 1; overflow: auto; position: relative; background-color: var(--bg); background-image: radial-gradient(var(--grid-dot) 1px, transparent 1px); background-size: 18px 18px; min-height: 0; }
.canvas { position: relative; }
.canvas svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.welcome { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
.welcome b { display: block; color: var(--fg); font-size: 15px; margin-bottom: 6px; }

.gnode { position: absolute; width: 200px; text-align: left; padding: 7px 10px 8px; border-radius: 10px; background: var(--node-bg); color: var(--node-fg); border: 1.5px solid color-mix(in srgb, var(--lc) 55%, transparent); cursor: pointer; z-index: 2; transition: opacity .15s, box-shadow .15s; }
.gnode .ty { display: flex; gap: 6px; align-items: center; font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: color-mix(in srgb, var(--lc) 75%, var(--node-fg)); }
.gnode .tt { font-family: var(--font-mono); font-size: 11px; margin-top: 3px; overflow-wrap: anywhere; }
.gnode .ln { display: grid; grid-template-columns: 22px 1fr; font-size: 10px; opacity: .7; margin-top: 2px; }
.gnode .stag { position: absolute; top: -9px; right: 8px; font-size: 10px; font-weight: 700; padding: 0 7px; border-radius: 999px; background: var(--sc); color: var(--bg); }
.gnode.start { box-shadow: 0 0 0 2px var(--select); }
.gnode.inStep { border: 2px solid var(--sc); }
.gnode.pickable:hover { box-shadow: 0 0 0 3px color-mix(in srgb, var(--sc) 60%, transparent); }
.gnode.dim { opacity: .45; }
.gedge { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.gedge.read { stroke: var(--data); stroke-dasharray: 6 4; }
.gedge.write { stroke: var(--data); }
.glabel rect { fill: var(--node-bg); stroke: var(--line); }
.glabel text { fill: var(--node-fg); font-size: 9.5px; font-weight: 700; font-family: var(--font-body); }

/* swimlane sinh từ nghiệp vụ người dùng viết */
.lane-wrap { padding: 16px; }
.lanes { display: grid; width: max-content; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.lanes > div { border-bottom: 1px solid var(--line); border-left: 1px dashed var(--line); padding: 10px; min-height: 56px; display: flex; flex-direction: column; gap: 8px; }
.lanes .lh { position: sticky; left: 0; z-index: 2; background: var(--surface); border-left: 3px solid var(--lc); font-weight: 600; font-size: 12px; }
.lanes .lh small { display: block; font-weight: 400; color: var(--muted); font-family: var(--font-mono); font-size: 10.5px; }
.lanes .sh { background: var(--surface-2); border-top: 3px solid var(--sc); }
.lanes .sh .no { font-family: var(--font-mono); font-size: 10.5px; color: var(--sc); font-weight: 700; }
.lanes .sh b { font-size: 13px; }
.lanes .sh small { color: var(--muted); font-size: 11px; }
.lanes .cell { background: color-mix(in srgb, var(--lc) 4%, transparent); }
.lcard { border-radius: 8px; padding: 6px 8px; background: var(--node-bg); color: var(--node-fg); border: 1.5px solid color-mix(in srgb, var(--lc) 55%, transparent); font-family: var(--font-mono); font-size: 10.5px; overflow-wrap: anywhere; }
.lcard .t { font-family: var(--font-body); font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: color-mix(in srgb, var(--lc) 75%, var(--node-fg)); }
.lcard.rule-c { font-family: var(--font-body); font-size: 11.5px; border-color: color-mix(in srgb, var(--rule) 60%, transparent); }
.lcard.orphan { border-style: dashed; border-color: var(--bad); }
.lcard.actor { font-family: var(--font-body); font-size: 12px; font-weight: 600; border-color: color-mix(in srgb, var(--biz) 60%, transparent); }

@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); height: auto; }
  .left { border-right: 0; border-bottom: 1px solid var(--line); }
  .canvas-wrap { min-height: 560px; }
}
@media (max-width: 480px) {
  .search { margin-left: max(16px, env(safe-area-inset-left, 0px)); margin-right: max(16px, env(safe-area-inset-right, 0px)); }
  .scroll { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .legend { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <aside class="left">
    <form class="search" id="search-form" role="search">
      <span aria-hidden="true" class="mono" style="color:var(--muted)">⌕</span>
      <input id="q" type="search" placeholder="Tìm method, API, bảng, màn hình hoặc nghiệp vụ…" autocomplete="off" aria-label="Tìm kiếm" value="createOrder">
      <button type="button" class="btn" id="browse">Browse</button>
    </form>
    <div class="scroll" id="left"></div>
  </aside>
  <main class="right">
    <div class="cbar" id="cbar"></div>
    <div class="canvas-wrap" id="canvas-wrap"><div class="canvas" id="canvas"></div></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>

const SAMPLE_YAML = `# docs/business/order.create.yaml
version: 1

function bindLeft() {
  const L = $("#left"), on = (s, fn) => L.querySelectorAll(s).forEach(el => el.addEventListener("click", e => fn(el, e)));
  on("[data-open]", el => { S.start = el.dataset.open; S.left = "node"; S.canvas = "graph"; renderAll(); });
  on("[data-open-flow]", () => { S.left = "flow"; if (!S.start) S.start = S.flow.steps[0].nodes[0]; S.canvas = "lane"; renderAll(); });
  on("[data-back]", () => { S.left = "search"; renderAll(); });
  on("[data-new]", () => { S.draft = { name: byNid[S.start].term || "", domain: "", description: "", steps: [] }; S.active = 0; S.left = "edit"; renderAll(); });
  on("[data-edit-existing]", () => { S.draft = JSON.parse(JSON.stringify(S.flow)); S.active = 0; S.left = "edit"; S.canvas = "graph"; renderAll(); });
  on("[data-yaml]", () => { S.left = "yaml"; S.yamlCheck = null; renderAll(); });
  on("[data-cancel]", () => { S.left = "node"; renderAll(); });
  on("[data-skeleton]", () => {
    const g = { ui: [], logic: [], data: [] };
    NODES.forEach(n => { const l = laneOf(n.ty)[0]; (l === "ui" || l === "api" ? g.ui : l === "data" || l === "ext" ? g.data : g.logic).push(n.id); });
    S.draft.steps = [["", g.ui], ["", g.logic], ["", g.data]].map(([name, nodes]) => ({ name, actor: "", nodes, rules: [] }));
    S.active = 0; renderAll(); setTimeout(() => $("#st-name-0")?.focus(), 0);
  });
  on("[data-step]", (el, e) => { if (e.target.closest("input,button,select")) return; S.active = +el.dataset.step; renderAll(); });
  on("[data-add-step]", () => { S.draft.steps.push({ name: "", actor: "", nodes: [], rules: [] }); S.active = S.draft.steps.length - 1; renderAll(); });
  on("[data-del-step]", el => { S.draft.steps.splice(+el.dataset.delStep, 1); S.active = Math.max(0, S.active - 1); renderAll(); });
  on("[data-unassign]", el => { const [i, nid] = el.dataset.unassign.split("|"); const s = S.draft.steps[+i]; s.nodes = s.nodes.filter(x => x !== nid); renderAll(); });
  on("[data-add-rule]", el => {
    const i = +el.dataset.addRule, text = $("#r-text-" + i).value.trim();
    if (!text) { $("#r-text-" + i).focus(); return; }
    S.draft.steps[i].rules.push({ text, at: $("#r-at-" + i).value, on_fail: $("#r-fail-" + i).value.trim() });
    renderAll();
  });
  on("[data-save]", () => { S.flow = { ...S.draft, source: "Viết trên Code Map" }; S.left = "flow"; S.canvas = "lane"; renderAll(); });
  on("[data-check]", () => { S.yamlText = $("#yaml-text").value; S.yamlCheck = checkYaml(S.yamlText); renderAll(); });
  on("[data-apply]", () => { S.flow = S.yamlCheck.flow; S.left = "flow"; S.canvas = "lane"; renderAll(); });
  on("[data-export]", () => { const o = $("#export-out"); o.textContent = toYaml(S.flow); o.hidden = false; });
  const bindVal = (s, fn) => L.querySelectorAll(s).forEach(el => el.addEventListener("input", () => { fn(el); refreshSave(); }));
  bindVal("#f-name", el => S.draft.name = el.value);
  bindVal("#f-domain", el => S.draft.domain = el.value);
  bindVal("#f-desc", el => S.draft.description = el.value);
  bindVal("[data-sname]", el => S.draft.steps[+el.dataset.sname].name = el.value);
  bindVal("[data-sactor]", el => S.draft.steps[+el.dataset.sactor].actor = el.value);
  const file = $("#yaml-file");
  if (file) file.addEventListener("change", () => { const f = file.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { S.yamlText = String(r.result); S.yamlCheck = null; renderAll(); }; r.readAsText(f); });
  const yt = $("#yaml-text"); if (yt) yt.addEventListener("input", () => { S.yamlText = yt.value; });
}
function refreshSave() { const b = $("[data-save]"); if (b) b.disabled = !(S.draft.name.trim() && S.draft.steps.some(s => s.nodes.length)); }

/* ===== YAML ===== */
function checkYaml(text) {
  let doc;
  try { doc = jsyaml.load(text); } catch (e) { return { error: "YAML sai cú pháp: " + e.message.split("\n")[0] }; }
  const f = doc && doc.flow;
  if (!f || !f.name || !Array.isArray(f.steps)) return { error: "Thiếu flow.name hoặc flow.steps." };
  const lines = [];
  const steps = f.steps.map((s, i) => {
    const nodes = [], orphans = [];
    for (const ref of s.nodes || []) {
      const [k, v] = Object.entries(ref || {})[0] || [];
      const n = byNm[String(v)];
      const ok = !!(n && KIND[k] === n.ty);
      lines.push({ sel: `${k}: ${v}`, ok });
      ok ? nodes.push(n.id) : orphans.push(`${k}: ${v}`);
    }
    return { name: s.name || `Bước ${i + 1}`, actor: s.actor || "", nodes, orphans, rules: (s.rules || []).map(r => ({ text: r.text, at: r.at, on_fail: r.on_fail || "" })) };
  });
  return { ok: true, lines, total: lines.length, found: lines.filter(l => l.ok).length,
    flow: { name: f.name, domain: f.domain || "", description: String(f.description || "").trim(), steps, source: "Import từ YAML" } };
}
function toYaml(f) {
  return jsyaml.dump({ version: 1, flow: { name: f.name, domain: f.domain, description: f.description || undefined,
    steps: f.steps.map(s => ({ name: s.name, actor: s.actor || undefined,
      nodes: [...s.nodes.map(nid => { const n = byNid[nid]; return { [KEY_OF[n.ty]]: n.nm }; }), ...(s.orphans || []).map(o => { const [k, ...v] = o.split(": "); return { [k]: v.join(": ") }; })],
      rules: s.rules.length ? s.rules.map(r => ({ text: r.text, at: r.at, on_fail: r.on_fail || undefined })) : undefined })) } }, { lineWidth: 100 });
}

  const c = $("#canvas");

    c.style.width = "100%"; c.style.height = "100%";
    c.innerHTML = `<div class="welcome"><div><b>Bắt đầu bằng tìm kiếm</b>Chọn một kết quả bên trái để mở graph của node đó.</div></div>`;

  }
  if (S.canvas === "lane" && S.flow && S.left !== "edit") return renderLanes(c);
  const W = 200, H = 78, CG = 110, RG = 30, PX = 40, PY = 40;
  const pos = NODES.map(n => ({ x: PX + n.col * (W + CG), y: PY + n.row * (H + RG) }));
  const width = PX * 2 + 10 * (W + CG) - CG, height = PY * 2 + 6 * (H + RG);
  const steps = S.left === "edit" ? S.draft.steps : S.flow ? S.flow.steps : [];
  let svg = `<svg width="${width}" height="${height}"><defs><marker id="gm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted)"/></marker></defs>`;
  for (const [a, b, t] of EDGES) {
    const A = pos[a], B = pos[b];
    let d;
    if (B.x > A.x) { const x1 = A.x + W, y1 = A.y + H / 2, x2 = B.x, y2 = B.y + H / 2, dx = (x2 - x1) / 2; d = `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
      const w = t.length * 5.6 + 10, mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      svg += `<path class="gedge ${/READS/.test(t) ? "read" : /INSERTS/.test(t) ? "write" : ""}" d="${d}" marker-end="url(#gm)"/><g class="glabel"><rect x="${mx - w / 2}" y="${my - 8}" width="${w}" height="16" rx="3"/><text x="${mx}" y="${my + 3.5}" text-anchor="middle">${t}</text></g>`; }
  }
  svg += "</svg>";
  const html = NODES.map((n, i) => {
    const si = steps.findIndex(s => s.nodes.includes(n.id));
    const cls = ["gnode", n.id === S.start ? "start" : "", si >= 0 ? "inStep" : "", S.left === "edit" ? "pickable" : "", S.left === "edit" && si >= 0 && si !== S.active ? "dim" : ""].join(" ");
    const sc = si >= 0 ? stepColor(si) : stepColor(S.active);
    return `<button type="button" class="${cls}" data-n="${esc(n.id)}" style="left:${pos[i].x}px;top:${pos[i].y}px;--lc:var(${COLOR[laneOf(n.ty)[0]]});--sc:var(${sc})">
      ${si >= 0 ? `<span class="stag">B${si + 1}</span>` : ""}<div class="ty">${n.ty.replace(/_/g, " ")}</div><div class="tt">${esc(n.nm)}</div>
      <div class="ln"><span>JA:</span><span>${esc(n.ja || "—")}</span></div><div class="ln"><span>EN:</span><span>${esc(n.en || "—")}</span></div></button>`;
  }).join("");
  c.style.width = width + "px"; c.style.height = height + "px";
  c.innerHTML = svg + html;
  c.querySelectorAll(".gnode").forEach(el => el.addEventListener("click", () => {
    const nid = el.dataset.n;
    if (S.left === "edit") {
      if (!S.draft.steps.length) S.draft.steps.push({ name: "", actor: "", nodes: [], rules: [] });
      S.draft.steps.forEach(s => { s.nodes = s.nodes.filter(x => x !== nid); });
      const s = S.draft.steps[S.active];
      if (!el.classList.contains("inStep") || flowOfNode(S.draft, nid) !== S.active) s.nodes.push(nid);
      renderAll(); return;
    }
    S.start = nid; S.left = "node"; renderAll();
  }));
}
function renderLanes(c) {
  const f = S.flow;
  const laneIds = ["ui", "api", "logic", "data", "ext"].filter(l => f.steps.some(s => s.nodes.some(nid => laneOf(byNid[nid].ty)[0] === l)));
  const laneName = { ui: ["Màn hình", "Angular"], api: ["API", ".NET"], logic: ["Xử lý", ".NET · PL/SQL"], data: ["Dữ liệu", "Oracle"], ext: ["Ngoài", "DB link"] };
  const n = f.steps.length;
  let h = `<div class="lane-wrap"><div class="lanes" style="grid-template-columns:130px repeat(${n}, 230px)">`;
  h += `<div class="lh" style="--lc:var(--line)"></div>` + f.steps.map((s, i) => `<div class="sh" style="--sc:var(${stepColor(i)})"><span class="no">B${i + 1}</span><b>${esc(s.name)}</b></div>`).join("");
  h += `<div class="lh" style="--lc:var(--biz)">Ai thực hiện<small>người dùng viết</small></div>` + f.steps.map(s => `<div class="cell" style="--lc:var(--biz)">${s.actor ? `<div class="lcard actor">${esc(s.actor)}</div>` : ""}</div>`).join("");
  h += `<div class="lh" style="--lc:var(--rule)">Quy tắc<small>người dùng viết</small></div>` + f.steps.map(s => `<div class="cell" style="--lc:var(--rule)">${s.rules.map(r => `<div class="lcard rule-c">◆ ${esc(r.text)}</div>`).join("")}</div>`).join("");
  for (const l of laneIds) {
    h += `<div class="lh" style="--lc:var(${COLOR[l]})">${laneName[l][0]}<small>${laneName[l][1]} · từ graph</small></div>`;
    h += f.steps.map(s => `<div class="cell" style="--lc:var(${COLOR[l]})">${s.nodes.filter(nid => laneOf(byNid[nid].ty)[0] === l).map(nid => { const nd = byNid[nid]; return `<div class="lcard" style="--lc:var(${COLOR[l]})"><div class="t">${nd.ty.replace(/_/g, " ")}</div>${esc(nd.nm)}</div>`; }).join("")}
      ${l === "data" ? (s.orphans || []).map(o => `<div class="lcard orphan" style="--lc:var(--bad)"><div class="t">mồ côi</div>${esc(o)}</div>`).join("") : ""}</div>`).join("");
  }
  h += `</div></div>`;
  c.style.width = "auto"; c.style.height = "auto";
  c.innerHTML = h;
}

function renderAll() { renderLeft(); renderBar(); renderCanvas(); }
$("#q").addEventListener("input", e => { S.q = e.target.value; if (S.left !== "edit" && S.left !== "yaml") { S.left = "search"; renderLeft(); } });
$("#search-form").addEventListener("submit", e => { e.preventDefault(); const first = $("#left [data-open]"); if (first) first.click(); });
$("#browse").addEventListener("click", () => { S.q = ""; $("#q").value = ""; S.left = "search"; renderLeft(); $("#q").focus(); });
renderAll();
</script>
