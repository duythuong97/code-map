<title>Code Map Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: thanh tìm kiếm cố định trên cùng → trang chủ (tìm + danh sách luồng) hoặc màn luồng chia đôi:
   trái = tài liệu nghiệp vụ dài (timeline các bước, trích dẫn node), phải = graph / swimlane đồng bộ với tài liệu. */
:root {
  color-scheme: dark;
  --bg: #090d16;
  --panel: #0e1420;
  --raised: #141b2a;
  --hover: #1a2233;
  --line: #222b3d;
  --line-soft: #1a2232;
  --fg: #e8ecf4;
  --fg-2: #c3cad8;
  --muted: #8791a6;
  --accent: #f2a541;
  --accent-ink: #1a1206;
  --focus: #6b9bff;
  --ai: #a58bff;
  --ok: #45c58c;
  --warn: #f0b84b;
  --bad: #f2675c;
  --t-ui: #5fb0f5; --t-api: #a58bff; --t-logic: #94a6c9; --t-data: #52c98b; --t-ext: #f07aa4;
  --s1: #3cc3b0; --s2: #f0b84b; --s3: #f07aa4; --s4: #5fb0f5; --s5: #a58bff;
  --node: #f4f6fb; --node-fg: #111827;
  --dot: #1b2438;
  --shadow: 0 10px 30px -12px rgba(0, 0, 0, .55), 0 2px 6px -2px rgba(0, 0, 0, .4);
  --font-ui: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #f5f6f9; --panel: #ffffff; --raised: #f8f9fc; --hover: #eff2f7; --line: #e1e5ec; --line-soft: #edf0f5;
    --fg: #121826; --fg-2: #2f3747; --muted: #667086; --accent: #c8710c; --accent-ink: #ffffff; --focus: #2f6fe0; --ai: #6d4fe0;
    --ok: #17875a; --warn: #a77405; --bad: #cc3b30;
    --t-ui: #1d72c2; --t-api: #6d4fe0; --t-logic: #4c5d80; --t-data: #17875a; --t-ext: #c23d6c;
    --s1: #0f8f80; --s2: #b07a06; --s3: #c23d6c; --s4: #1d72c2; --s5: #6d4fe0;
    --node: #ffffff; --node-fg: #111827; --dot: #d9dee8;
    --shadow: 0 12px 30px -14px rgba(20, 30, 60, .25), 0 2px 6px -2px rgba(20, 30, 60, .12);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f5f6f9; --panel: #ffffff; --raised: #f8f9fc; --hover: #eff2f7; --line: #e1e5ec; --line-soft: #edf0f5;
  --fg: #121826; --fg-2: #2f3747; --muted: #667086; --accent: #c8710c; --accent-ink: #ffffff; --focus: #2f6fe0; --ai: #6d4fe0;
  --ok: #17875a; --warn: #a77405; --bad: #cc3b30;
  --t-ui: #1d72c2; --t-api: #6d4fe0; --t-logic: #4c5d80; --t-data: #17875a; --t-ext: #c23d6c;
  --s1: #0f8f80; --s2: #b07a06; --s3: #c23d6c; --s4: #1d72c2; --s5: #6d4fe0;
  --node: #ffffff; --node-fg: #111827; --dot: #d9dee8;
  --shadow: 0 12px 30px -14px rgba(20, 30, 60, .25), 0 2px 6px -2px rgba(20, 30, 60, .12);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 13.5px; line-height: 1.5; overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
code, .mono { font-family: var(--font-mono); font-size: .86em; }
kbd { font-family: var(--font-mono); font-size: 10.5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--muted); background: var(--raised); }

.shell { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }

/* ---------------- Top bar ---------------- */
.top { position: relative; z-index: 40; display: grid; grid-template-columns: auto minmax(0, 620px) 1fr; align-items: center; gap: 16px;
  padding: 10px 18px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(10px); }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; letter-spacing: -.01em; border: 0; background: none; padding: 0; white-space: nowrap; }
.logo svg { flex: none; }
.logo span { color: var(--muted); font-weight: 500; font-size: 12px; }
.search { position: relative; }
.search-box { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 8px 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); transition: border-color .15s, box-shadow .15s; }
.search-box:focus-within { border-color: color-mix(in srgb, var(--focus) 60%, var(--line)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--focus) 16%, transparent); }
.search-box input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: 14px; }
.search-box svg { color: var(--muted); flex: none; }
.drop { position: absolute; top: calc(100% + 6px); left: 0; right: 0; max-height: min(520px, 70vh); overflow-y: auto; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow); padding: 6px; }
.drop h6 { margin: 8px 10px 4px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.hit { width: 100%; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; padding: 8px 10px; border: 0; border-radius: 8px; background: none; }
.hit:hover, .hit.kb { background: var(--hover); }
.hit .ic { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c); }
.hit .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hit .t.m { font-family: var(--font-mono); font-size: 12.5px; font-weight: 500; }
.hit .s { display: block; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 400; font-family: var(--font-ui); }
.hit .r { font-size: 11px; color: var(--muted); white-space: nowrap; }
.hit[disabled] { opacity: .5; cursor: default; }
.hit mark { background: color-mix(in srgb, var(--accent) 30%, transparent); color: inherit; border-radius: 3px; }
.top-r { display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
.ws { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.ws i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; }

.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-size: 12.5px; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn:hover { background: var(--hover); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.pri:hover { filter: brightness(1.06); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; border-radius: 7px; }
.btn.ghost { border-color: transparent; background: none; }
.btn.ghost:hover { background: var(--hover); }
.btn.on { border-color: color-mix(in srgb, var(--focus) 60%, var(--line)); background: color-mix(in srgb, var(--focus) 14%, transparent); }
.icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg-2); }
.icon-btn:hover { background: var(--hover); }

/* ---------------- Home ---------------- */
.home { overflow-y: auto; }
.home-in { max-width: 1040px; margin: 0 auto; padding-block: 56px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 40px; }
.hero { display: grid; gap: 14px; }
.hero h1 { margin: 0; font-size: clamp(26px, 3.4vw, 36px); letter-spacing: -.025em; line-height: 1.15; text-wrap: balance; max-width: 22ch; }
.hero p { margin: 0; color: var(--muted); font-size: 15px; max-width: 62ch; }
.try { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 12.5px; }
.try button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; }
.try button:hover { border-color: var(--muted); }
.try .m { font-family: var(--font-mono); font-size: 12px; }
.sec-t { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sec-t h2 { margin: 0; font-size: 16px; letter-spacing: -.01em; }
.sec-t span { color: var(--muted); font-size: 12.5px; }
.flows { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.fcard { display: grid; gap: 12px; text-align: left; padding: 16px 18px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); transition: border-color .15s, transform .15s; }
.fcard:not([disabled]):hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); transform: translateY(-1px); }
.fcard[disabled] { cursor: default; }
.fcard .dom { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.fcard h3 { margin: 0; font-size: 16px; letter-spacing: -.01em; }
.fcard p { margin: 0; color: var(--fg-2); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fmeta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); align-items: center; }
.steps-mini { display: flex; gap: 3px; }
.steps-mini i { height: 5px; flex: 1; border-radius: 3px; background: var(--line); }
.steps-mini i.ok { background: var(--ok); }
.steps-mini i.ed { background: var(--focus); }
.steps-mini i.ai { background: color-mix(in srgb, var(--ai) 55%, transparent); }

.prov { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); }
.prov.ai { --c: var(--ai); }
.prov.edited { --c: var(--focus); }
.prov.ok { --c: var(--ok); }
.prov.warn { --c: var(--warn); }
.prov.bad { --c: var(--bad); }

/* ---------------- Flow screen ---------------- */
.flow { display: grid; grid-template-columns: minmax(460px, 46%) minmax(0, 1fr); min-height: 0; height: 100%; }
.doc { overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); min-width: 0; scroll-behavior: smooth; }
.doc-in { padding-block: 28px 80px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: 28px; display: grid; gap: 28px; max-width: 760px; }
.crumb { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12.5px; flex-wrap: wrap; }
.crumb button { border: 0; background: none; padding: 0; color: var(--muted); }
.crumb button:hover { color: var(--fg); }
.doc-h { display: grid; gap: 12px; }
.doc-h h1 { margin: 0; font-size: 28px; letter-spacing: -.025em; line-height: 1.2; text-wrap: balance; }
.doc-meta { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); }
.review { display: flex; align-items: center; gap: 10px; }
.review .bar { width: 120px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex; }
.review .bar i { height: 100%; }
.doc-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.note-regen { font-size: 12.5px; color: var(--fg-2); border: 1px solid color-mix(in srgb, var(--ai) 40%, var(--line)); background: color-mix(in srgb, var(--ai) 8%, transparent); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }

.toc { position: sticky; top: 0; z-index: 5; margin: -28px -28px 0; padding: 10px 28px; display: flex; gap: 6px; flex-wrap: wrap; background: color-mix(in srgb, var(--panel) 90%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line-soft); }
.toc button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; height: 26px; padding: 0 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; color: var(--fg-2); }
.toc button i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); }
.toc button[aria-current="true"] { border-color: color-mix(in srgb, var(--c, var(--focus)) 70%, var(--line)); color: var(--fg); background: color-mix(in srgb, var(--c, var(--focus)) 12%, var(--panel)); }

.prose { font-size: 15px; line-height: 1.72; color: var(--fg-2); max-width: 68ch; }
.prose p { margin: 0 0 12px; }
.prose p:last-child { margin-bottom: 0; }
.prose strong { color: var(--fg); font-weight: 600; }
.ref { display: inline-flex; align-items: center; gap: 5px; vertical-align: baseline; border: 1px solid color-mix(in srgb, var(--c) 35%, var(--line)); background: color-mix(in srgb, var(--c) 10%, transparent); color: var(--fg); border-radius: 6px; padding: 0 6px; margin: 0 1px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; transition: background .15s, box-shadow .15s; }
.ref::before { content: ""; width: 6px; height: 6px; border-radius: 2px; background: var(--c); }
.ref:hover { background: color-mix(in srgb, var(--c) 22%, transparent); }
.ref.sel { box-shadow: 0 0 0 2px var(--focus); }
.ref.missing { border-style: dashed; --c: var(--bad); }

.block { display: grid; gap: 12px; scroll-margin-top: 56px; }
.block-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.block-h h2 { margin: 0; font-size: 18px; letter-spacing: -.015em; flex: 1; min-width: 0; }
.label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--line); }
.facts div { background: var(--panel); padding: 10px 14px; display: grid; gap: 2px; }
.facts dt { font-size: 11.5px; color: var(--muted); }
.facts dd { margin: 0; font-size: 13.5px; color: var(--fg); }

.timeline { display: grid; gap: 0; }
.step { position: relative; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 14px; padding: 6px 0 30px; scroll-margin-top: 56px; }
.step::before { content: ""; position: absolute; left: 17px; top: 40px; bottom: 0; width: 2px; background: var(--line); }
.step:last-child::before { display: none; }
.step .num { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; border: 2px solid var(--c); color: var(--c); background: var(--panel); position: relative; z-index: 1; transition: background .15s, color .15s; }
.step.active .num { background: var(--c); color: var(--panel); }
.step-body { display: grid; gap: 12px; min-width: 0; border-radius: var(--r); padding: 8px 14px 14px; margin: -8px -14px 0; transition: background .2s; cursor: pointer; }
.step.active .step-body { background: color-mix(in srgb, var(--c) 6%, transparent); }
.step-h { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.step-h h3 { margin: 0; font-size: 18px; letter-spacing: -.015em; line-height: 1.3; flex: 1; min-width: 12ch; }
.actor { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--fg-2); }
.actor svg { color: var(--muted); }
.step-tools { display: flex; gap: 4px; }

.rules { display: grid; gap: 8px; }
.rule { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); }
.rule > svg { color: var(--warn); margin-top: 3px; }
.rule b { display: block; font-size: 14px; color: var(--fg); font-weight: 600; }
.rule p { margin: 4px 0 0; font-size: 13.5px; color: var(--fg-2); line-height: 1.6; }
.rule .rf { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; font-size: 12px; color: var(--muted); }
.nodes-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.nodes-row .label { margin-right: 4px; }

.list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.list li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; font-size: 14px; color: var(--fg-2); line-height: 1.65; }
.list li svg { margin-top: 4px; color: var(--muted); }
.q { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; background: var(--raised); }
.q.done { border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
.q p { margin: 0; font-size: 14px; color: var(--fg); line-height: 1.6; }
.q .ans { font-size: 13.5px; color: var(--fg-2); border-left: 2px solid var(--ok); padding-left: 10px; }
.q form { display: flex; gap: 8px; }
.q input { flex: 1; min-width: 0; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); padding: 0 10px; }

/* editor */
.edit { display: grid; gap: 12px; padding: 14px; border-radius: var(--r); border: 1px solid color-mix(in srgb, var(--focus) 50%, var(--line)); background: var(--panel); box-shadow: 0 0 0 4px color-mix(in srgb, var(--focus) 10%, transparent); cursor: default; }
.field { display: grid; gap: 5px; }
.field label { font-size: 12px; color: var(--muted); font-weight: 600; }
.field input, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--raised); border-radius: 8px; padding: 8px 10px; line-height: 1.6; }
.field textarea { resize: vertical; min-height: 160px; font-size: 14px; }
.field textarea.sm { min-height: 64px; font-size: 13px; }
.field small { color: var(--muted); font-size: 11.5px; }
.edit-foot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.pickhint { font-size: 12px; color: var(--focus); }

/* ---------------- Canvas ---------------- */
.stage { position: relative; min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.stage-bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
.seg { display: inline-flex; padding: 3px; border-radius: 9px; background: var(--raised); border: 1px solid var(--line); }
.seg button { border: 0; background: none; height: 26px; padding: 0 12px; border-radius: 6px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.25), inset 0 0 0 1px var(--line); }
.stage-info { color: var(--muted); font-size: 12.5px; }
.zoom { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.zoom span { font-size: 11.5px; color: var(--muted); width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
.canvas-wrap { overflow: auto; background-color: var(--bg); background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px); background-size: 20px 20px; position: relative; scroll-behavior: smooth; }
.sizer { position: relative; }
.canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.canvas svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.halo { position: absolute; border-radius: 16px; border: 1.5px solid color-mix(in srgb, var(--c) 55%, transparent); background: color-mix(in srgb, var(--c) 7%, transparent); transition: opacity .2s; }
.halo span { position: absolute; top: -12px; left: 14px; height: 22px; padding: 0 10px; border-radius: 999px; background: var(--c); color: var(--panel); font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center; white-space: nowrap; }
.halo.dim { opacity: .3; }
.gn { position: absolute; width: 212px; text-align: left; padding: 9px 12px 10px; border-radius: 12px; background: var(--node); color: var(--node-fg); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); box-shadow: 0 1px 0 rgba(0,0,0,.08), 0 4px 14px -8px rgba(0,0,0,.45); z-index: 2; transition: opacity .2s, box-shadow .15s, transform .15s; }
.gn:hover { transform: translateY(-1px); }
.gn .ty { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: color-mix(in srgb, var(--c) 80%, var(--node-fg)); }
.gn .ty i { width: 7px; height: 7px; border-radius: 2px; background: var(--c); }
.gn .nm { font-family: var(--font-mono); font-size: 11.5px; margin-top: 4px; overflow-wrap: anywhere; line-height: 1.35; }
.gn .alt { font-size: 10.5px; opacity: .62; margin-top: 3px; }

/* text: đoạn cách nhau 1 dòng trống, [[tên node]] = trích dẫn, **đậm**, `code` */
function rich(t) {
  return String(t).split(/\n\s*\n/).map(p => `<p>${inline(p)}</p>`).join("");
}
function inline(p) {
  return esc(p).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[\[(.+?)\]\]/g, (_, name) => {
      const n = byNm[name.replace(/&amp;/g, "&")];
      if (!n) return `<span class="ref missing" title="Không có node này trong graph">${name}</span>`;
      return `<button type="button" class="ref${S.sel === n.id ? " sel" : ""}" data-ref="${esc(n.id)}" style="--c:var(${tc(n.ty)})">${name}</button>`;
    });
}

/* ======================= Search ======================= */
function searchIndex() {
  const out = [];
  out.push({ kind: "flow", label: FLOW.name, sub: `${FLOW.domain} · ${FLOW.steps.length} bước`, text: FLOW.name + " " + FLOW.summary.text, go: () => openFlow() });
  FLOW.steps.forEach((s, i) => {
    out.push({ kind: "step", label: s.name, sub: `${FLOW.name} · Bước ${i + 1}`, text: s.name + " " + s.text, n: i, go: () => openFlow({ step: i }) });
    s.rules.forEach(r => out.push({ kind: "rule", label: r.title, sub: `${FLOW.name} · Bước ${i + 1}`, text: r.title + " " + r.text, go: () => openFlow({ step: i }) }));
  });
  OTHER_FLOWS.forEach(f => out.push({ kind: "flow", label: f.name, sub: `${f.domain} · mockup chỉ mở luồng Tạo đơn hàng`, text: f.name + " " + f.text, off: true }));
  NODES.forEach(n => out.push({ kind: "node", ty: n.ty, label: n.nm, sub: [n.ty.replace(/_/g, " "), n.term && "từ điển: " + n.term, n.ja].filter(Boolean).join(" · "),
    text: [n.nm, n.term, n.ja, n.en].join(" "), r: stepsOf(n.id).map(i => "B" + (i + 1)).join(" "), go: () => openFlow({ node: n.id }) }));
  OTHER_NODES.forEach(([ty, nm]) => out.push({ kind: "node", ty, label: nm, sub: ty.replace(/_/g, " ") + " · chưa thuộc luồng nào đã viết", text: nm, off: true }));
  return out;
}
const INDEX = searchIndex();
function runSearch(q) {
  const toks = q.toLowerCase().trim().split(/\s+/).filter(Boolean);
  if (!toks.length) return [];
  return INDEX.filter(it => toks.every(t => (it.label + " " + it.text).toLowerCase().includes(t)));
}
function hl(label, q) {
  let s = esc(label);
  q.trim().split(/\s+/).filter(t => t.length > 1).forEach(t => { s = s.replace(new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig"), "<mark>$1</mark>"); });
  return s;
}
function renderDrop() {
  const q = $("#q").value, drop = $("#drop");
  const res = runSearch(q);
  if (!q.trim()) { drop.hidden = true; return; }
  const groups = [["flow", "Luồng nghiệp vụ"], ["step", "Bước"], ["rule", "Quy tắc"], ["node", "Node trong code"]];
  let k = 0, h = "";
  for (const [kind, title] of groups) {
    const items = res.filter(r => r.kind === kind).slice(0, kind === "node" ? 8 : 5);
    if (!items.length) continue;
    h += `<h6>${title}</h6>` + items.map(it => {
      const idx = res.indexOf(it), c = it.kind === "node" ? tc(it.ty) : it.kind === "rule" ? "--warn" : it.kind === "step" ? sc(it.n) : "--accent";
      const ic = it.kind === "node" ? it.ty.slice(0, 2) : it.kind === "rule" ? "◆" : it.kind === "step" ? "B" + (it.n + 1) : "✦";
      return `<button type="button" class="hit${k++ === S.kb ? " kb" : ""}" data-hit="${idx}" ${it.off ? "disabled" : ""} style="--c:var(${c})"><span class="ic">${ic}</span>
        <span class="t${it.kind === "node" ? " m" : ""}">${hl(it.label, q)}<span class="s">${esc(it.sub)}</span></span><span class="r">${esc(it.r || "")}</span></button>`;
    }).join("");
  }
  drop.innerHTML = h || `<p style="margin:10px;color:var(--muted)">Không có kết quả cho “${esc(q)}”. Thử tên bảng, API, method hoặc tên tiếng Nhật.</p>`;
  drop.hidden = false;
  drop.querySelectorAll("[data-hit]").forEach(b => b.addEventListener("click", () => pick(res[+b.dataset.hit])));
  drop._res = [...drop.querySelectorAll("[data-hit]:not([disabled])")].map(b => res[+b.dataset.hit]);
}
function pick(it) { if (!it || it.off) return; $("#drop").hidden = true; $("#q").blur(); it.go(); }
$("#q").addEventListener("input", () => { S.kb = 0; renderDrop(); });
$("#q").addEventListener("focus", renderDrop);
$("#q").addEventListener("keydown", e => {
  const list = $("#drop")._res || [];
  if (e.key === "ArrowDown") { S.kb = Math.min(S.kb + 1, list.length - 1); renderDrop(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { S.kb = Math.max(S.kb - 1, 0); renderDrop(); e.preventDefault(); }
  else if (e.key === "Enter") { pick(list[S.kb]); e.preventDefault(); }
  else if (e.key === "Escape") { $("#drop").hidden = true; $("#q").blur(); }
});
document.addEventListener("click", e => { if (!e.target.closest("#search")) $("#drop").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "/" && !e.target.closest("input,textarea")) { e.preventDefault(); $("#q").focus(); } });

/* ======================= Flow ======================= */
function openFlow(opt = {}) {
  S.view = "flow"; S.editing = null; S.pick = false;
  S.sel = opt.node || null;
  S.step = opt.step ?? (opt.node ? (stepsOf(opt.node)[0] ?? null) : null);
  renderFlow();
  requestAnimationFrame(() => {
    if (S.step != null) document.getElementById("step-" + S.step)?.scrollIntoView({ block: "start" });
    if (opt.node) scrollDocToNode(opt.node);
    focusCanvas();
  });
}
function renderFlow() {
  $("#main").innerHTML = `<div class="flow"><article class="doc" id="doc"></article>
    <section class="stage"><div class="stage-bar" id="stage-bar"></div><div class="canvas-wrap" id="cwrap"><div class="sizer" id="sizer"><div class="canvas" id="canvas"></div></div></div><div id="pop"></div></section></div>`;
  renderDoc(); renderStage();
}

    ${editing ? editorHtml(key) : body}</section>`;
}
function provHtml(p) { const [cls, label] = PROV[p.prov]; return `<span class="prov ${cls}">${label}${p.prov === "ok" && p.by ? " · " + esc(p.by) : ""}</span>`; }

function partOf(key) { return key === "summary" ? FLOW.summary : key === "edge" ? FLOW.edge : FLOW.steps[+key]; }

    const key = /^\d+$/.test(el.dataset.edit) ? +el.dataset.edit : el.dataset.edit;

    S.editing = key; S.pick = false;
    S.draft = key === "edge" ? { text: p.items.join("\n\n") } : JSON.parse(JSON.stringify(p));
    if (typeof key === "number") setStep(key, true);
    renderDoc(); renderStage();
    setTimeout(() => $("#ed-text")?.focus(), 0);
  });
  on("[data-approve]", (el, e) => { e.stopPropagation(); const p = partOf(/^\d+$/.test(el.dataset.approve) ? +el.dataset.approve : el.dataset.approve); p.prov = "ok"; p.by = "bạn"; renderDoc(); toast("Đã duyệt"); });
  on("[data-cancel]", () => { S.editing = null; S.pick = false; renderDoc(); renderStage(); });
  on("[data-save]", () => {
    const key = S.editing, p = partOf(key), d = S.draft;

    renderDoc(); renderStage(); toast("Đã lưu. Phần này sẽ không bị AI ghi đè.");
  });

  on("[data-export]", openExport);
  D.querySelectorAll("[data-ans]").forEach(f => f.addEventListener("submit", e => {
    e.preventDefault(); const i = +f.dataset.ans, v = $("#ans-" + i).value.trim(); if (!v) return;
    FLOW.questions[i].a = v; renderDoc(); toast("Đã lưu câu trả lời");
  }));
  // giữ nội dung đang gõ khi đổi node đã chọn
  ["#ed-name", "#ed-actor", "#ed-text"].forEach(s => { const el = $(s); if (el) el.addEventListener("input", () => { const k = { "#ed-name": "name", "#ed-actor": "actor", "#ed-text": "text" }[s]; S.draft[k] = el.value; }); });
  D.querySelectorAll("[data-rt]").forEach(el => el.addEventListener("input", () => { S.draft.rules[+el.dataset.rt].title = el.value; }));
  D.querySelectorAll("[data-rd]").forEach(el => el.addEventListener("input", () => { S.draft.rules[+el.dataset.rd].text = el.value; }));
}
function setStep(i, quiet) {
  S.step = S.step === i && !quiet ? null : i;
  document.querySelectorAll(".step").forEach(el => el.classList.toggle("active", el.id === "step-" + S.step));
  document.querySelectorAll("[data-toc]").forEach(b => b.setAttribute("aria-current", b.dataset.toc === String(S.step)));
  if (!quiet) { renderStage(); focusCanvas(); }
}
function selectNode(nid, opt = {}) {
  if (S.editing !== null && S.pick && typeof S.editing === "number") {
    const d = S.draft; d.nodes = d.nodes.includes(nid) ? d.nodes.filter(x => x !== nid) : [...d.nodes, nid];
    renderDoc(); renderStage(); return;
  }
  S.sel = S.sel === nid && !opt.fromDoc ? null : nid;
  document.querySelectorAll(".ref").forEach(r => r.classList.toggle("sel", r.dataset.ref === S.sel));
  renderStage();
  if (opt.fromDoc) focusCanvas(nid);
  else if (S.sel) scrollDocToNode(S.sel);
}
function scrollDocToNode(nid) {
  const el = document.querySelector(`#doc .step .prose .ref[data-ref="${CSS.escape(nid)}"]`) || document.querySelector(`#doc .ref[data-ref="${CSS.escape(nid)}"]`);
  if (el) el.scrollIntoView({ block: "center" });
}

/* ======================= Stage: graph / swimlane ======================= */
const W = 212, H = 80, CG = 96, RG = 34, PX = 50, PY = 56;
const pos = NODES.map(n => ({ x: PX + n.col * (W + CG), y: PY + n.row * (H + RG) }));
const GW = PX * 2 + 10 * (W + CG) - CG, GH = PY + 6 * (H + RG) + 30;
function renderStage() {
  const editingStep = typeof S.editing === "number" ? S.editing : null;
  $("#stage-bar").innerHTML = `<span class="seg"><button type="button" data-mode="graph" aria-pressed="${S.mode === "graph"}">Graph</button><button type="button" data-mode="lane" aria-pressed="${S.mode === "lane"}">Swimlane</button></span>
    <span class="stage-info">${S.mode === "graph" ? `${NODES.length} node · ${EDGES.length} cạnh${S.step != null ? ` · đang xem B${S.step + 1}` : ""}` : `${FLOW.steps.length} bước × lớp hệ thống`}</span>
    ${S.mode === "graph" ? `<span class="zoom"><button type="button" class="icon-btn" data-z="-" aria-label="Thu nhỏ">−</button><span>${Math.round(S.zoom * 100)}%</span><button type="button" class="icon-btn" data-z="+" aria-label="Phóng to">+</button><button type="button" class="btn sm" data-z="fit">Vừa khung</button></span>` : ""}`;
  $("#stage-bar").querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => { S.mode = b.dataset.mode; renderStage(); if (S.mode === "graph") focusCanvas(); }));
  $("#stage-bar").querySelectorAll("[data-z]").forEach(b => b.addEventListener("click", () => {
    const z = b.dataset.z, wrap = $("#cwrap");
    S.zoom = z === "fit" ? Math.max(.35, Math.min(1, (wrap.clientWidth - 20) / GW, (wrap.clientHeight - 20) / GH)) : Math.max(.35, Math.min(1.4, S.zoom + (z === "+" ? .1 : -.1)));
    renderStage();
  }));
  if (S.mode === "lane") return renderLanes();
  const steps = FLOW.steps.map((s, i) => i === editingStep ? S.draft.nodes : s.nodes);
  const focusSet = S.step != null ? new Set(steps[S.step]) : null;
  const dimNode = nid => focusSet && !focusSet.has(nid);
  let html = "";
  let svg = `<svg width="${GW}" height="${GH}"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted)"/></marker></defs>`;
  for (const [a, b, t] of EDGES) {
    const A = pos[a], B = pos[b], x1 = A.x + W, y1 = A.y + H / 2, x2 = B.x, y2 = B.y + H / 2, dx = (x2 - x1) / 2;
    const dim = focusSet && !(focusSet.has(NODES[a].id) && focusSet.has(NODES[b].id));
    const w = t.length * 5.8 + 12, mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    svg += `<path class="ge ${/READS/.test(t) ? "read" : /INSERTS/.test(t) ? "write" : ""}${dim ? " dim" : ""}" d="M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}" marker-end="url(#ah)"/>
      <g class="gl${dim ? " dim" : ""}"><rect x="${mx - w / 2}" y="${my - 9}" width="${w}" height="18" rx="9"/><text x="${mx}" y="${my + 3.5}" text-anchor="middle">${t}</text></g>`;
  }
  svg += "</svg>";
  html += NODES.map((n, i) => {
    const st = steps.map((ns, k) => ns.includes(n.id) ? k : -1).filter(k => k >= 0);
    const picked = editingStep != null && S.pick && steps[editingStep].includes(n.id);
    return `<button type="button" class="gn${dimNode(n.id) && !picked ? " dim" : ""}${S.sel === n.id ? " sel" : ""}${picked ? " picked" : ""}${!S.pick && focusSet && focusSet.has(n.id) ? " focus" : ""}${S.pick ? " pickable" : ""}" data-n="${esc(n.id)}"
      style="left:${pos[i].x}px;top:${pos[i].y}px;--c:var(${tc(n.ty)});--sc:var(${sc(editingStep ?? S.step ?? 0)})">
      <span class="tags">${st.map(k => `<b style="--sc:var(${sc(k)})">B${k + 1}</b>`).join("")}</span>
      <div class="ty"><i></i>${n.ty.replace(/_/g, " ")}</div><div class="nm">${esc(n.nm)}</div>
      <div class="alt">${n.ja ? esc(n.ja) + " · " : ""}${esc(n.en || n.term || "—")}</div></button>`;
  }).join("");
  const c = $("#canvas");
  c.style.width = GW + "px"; c.style.height = GH + "px"; c.style.transform = `scale(${S.zoom})`;
  $("#sizer").style.width = GW * S.zoom + "px"; $("#sizer").style.height = GH * S.zoom + "px";
  c.innerHTML = svg + html;
  c.querySelectorAll(".gn").forEach(el => el.addEventListener("click", () => selectNode(el.dataset.n)));
  renderPop();
}
function focusCanvas(nid) {
  if (S.mode !== "graph") return;
  const wrap = $("#cwrap"); if (!wrap) return;
  let ps;
  if (nid) ps = [pos[NODES.findIndex(n => n.id === nid)]];
  else if (S.step != null) ps = FLOW.steps[S.step].nodes.map(id => pos[NODES.findIndex(n => n.id === id)]);
  else ps = [pos[0]];
  const cx = (Math.min(...ps.map(p => p.x)) + Math.max(...ps.map(p => p.x)) + W) / 2 * S.zoom, cy = (Math.min(...ps.map(p => p.y)) + Math.max(...ps.map(p => p.y)) + H) / 2 * S.zoom;
  wrap.scrollTo({ left: Math.max(0, cx - wrap.clientWidth / 2), top: Math.max(0, cy - wrap.clientHeight / 2) });
}
function renderPop() {
  const pop = $("#pop");
  if (!S.sel || S.mode !== "graph" || S.pick) { pop.innerHTML = ""; return; }
  const n = byId[S.sel], st = stepsOf(n.id);
  const ments = [];
  FLOW.steps.forEach((s, i) => {
    if (s.text.includes("[[" + n.nm + "]]")) ments.push([i, `B${i + 1} · ${s.name}`]);
    s.rules.forEach(r => { if (r.at === n.nm) ments.push([i, `Quy tắc: ${r.title}`]); });
  });
  pop.innerHTML = `<div class="pop" style="--c:var(${tc(n.ty)})"><div class="pop-h"><div><div class="tyl">${n.ty.replace(/_/g, " ")}</div><h4>${esc(n.nm)}</h4></div><button type="button" class="icon-btn" data-close aria-label="Đóng">${ICON.close}</button></div>
    <dl class="kv"><dt>node_id</dt><dd><code>${esc(n.id)}</code></dd>${n.file ? `<dt>Nguồn</dt><dd><code>${esc(n.file)}</code></dd>` : ""}${n.term ? `<dt>Từ điển</dt><dd>${esc(n.term)}</dd>` : ""}${n.ja ? `<dt>JA / EN</dt><dd>${esc(n.ja)} · ${esc(n.en)}</dd>` : ""}
      <dt>Thuộc bước</dt><dd>${st.length ? st.map(i => "B" + (i + 1)).join(", ") : "chưa thuộc bước nào"}</dd></dl>
    ${ments.length ? `<div class="mentions"><span class="label">Được nhắc trong tài liệu</span>${ments.map(([i, t]) => `<button type="button" data-ment="${i}" style="--c:var(${sc(i)})"><i></i>${esc(t)}</button>`).join("")}</div>` : ""}</div>`;
  pop.querySelector("[data-close]").addEventListener("click", () => { S.sel = null; document.querySelectorAll(".ref.sel").forEach(r => r.classList.remove("sel")); renderStage(); });
  pop.querySelectorAll("[data-ment]").forEach(b => b.addEventListener("click", () => { setStep(+b.dataset.ment, true); renderStage(); scrollDocToNode(S.sel); }));
}
function renderLanes() {
  const lanes = [["--t-ui", "Màn hình", "Angular", n => TY[n.ty][1] === "Màn hình"], ["--t-api", "API", ".NET", n => n.ty === "API_OPERATION"],
    ["--t-logic", "Xử lý", ".NET · PL/SQL", n => TY[n.ty][1] === "Xử lý"], ["--t-data", "Dữ liệu", "Oracle", n => n.ty === "TABLE"], ["--t-ext", "Ngoài", "DB link", n => n.ty === "EXTERNAL_DATABASE_OBJECT"]];
  const cols = FLOW.steps.length;
  const act = i => S.step === i ? " active" : "";
  let h = `<div class="lanes-wrap"><div class="lanes" style="grid-template-columns:150px repeat(${cols}, 260px)">`;
  h += `<div class="lh" style="--c:transparent"></div>` + FLOW.steps.map((s, i) => `<div class="ch${act(i)}" data-lstep="${i}" style="--c:var(${sc(i)})"><small>BƯỚC ${i + 1}</small><b>${esc(s.name)}</b></div>`).join("");
  h += `<div class="lh" style="--c:var(--s1)">Ai thực hiện<small>tài liệu</small></div>` + FLOW.steps.map((s, i) => `<div class="cell${act(i)}" style="--c:var(${sc(i)})"><div class="lc txt" style="--c:var(--s1)">${esc(s.actor)}</div></div>`).join("");
  h += `<div class="lh" style="--c:var(--warn)">Quy tắc<small>tài liệu</small></div>` + FLOW.steps.map((s, i) => `<div class="cell${act(i)}" style="--c:var(${sc(i)})">${s.rules.map(r => `<div class="lc txt" style="--c:var(--${r.status === "bad" ? "bad" : "warn"})">◆ ${esc(r.title)}</div>`).join("")}</div>`).join("");
  for (const [c, name, tech, fit] of lanes) {
    if (!FLOW.steps.some(s => s.nodes.some(id => fit(byId[id])))) continue;
    h += `<div class="lh" style="--c:var(${c})">${name}<small>${tech} · graph</small></div>`;
    h += FLOW.steps.map((s, i) => `<div class="cell${act(i)}" style="--c:var(${sc(i)})">${s.nodes.filter(id => fit(byId[id])).map(id => { const n = byId[id]; return `<button type="button" class="lc${S.sel === id ? " sel" : ""}" data-lnode="${esc(id)}" style="--c:var(${c})"><span class="t">${n.ty.replace(/_/g, " ")}</span>${esc(n.nm)}</button>`; }).join("")}</div>`).join("");
  }
  h += `</div></div>`;
  $("#sizer").style.width = "auto"; $("#sizer").style.height = "auto";
  const c = $("#canvas"); c.style.transform = "none"; c.style.position = "static"; c.style.width = "auto"; c.style.height = "auto";
  c.innerHTML = h;
  $("#cwrap").scrollTo({ left: 0, top: 0, behavior: "instant" });
  c.querySelectorAll("[data-lstep]").forEach(el => el.addEventListener("click", () => { setStep(+el.dataset.lstep); document.getElementById("step-" + el.dataset.lstep).scrollIntoView({ block: "start" }); }));
  c.querySelectorAll("[data-lnode]").forEach(el => el.addEventListener("click", () => { S.sel = el.dataset.lnode; renderStage(); scrollDocToNode(S.sel); document.querySelectorAll(".ref").forEach(r => r.classList.toggle("sel", r.dataset.ref === S.sel)); }));
  $("#pop").innerHTML = "";
}

/* ======================= Import / Export ======================= */
const SAMPLE_IMPORT = `# Kết quả AI xuất cho luồng "Tạo đơn hàng"
version: 1
flow:
  id: order.create
  name: Tạo đơn hàng
  domain: Đơn hàng
  summary: |
    Nhân viên bán hàng lập đơn cho khách trên màn hình Tạo đơn...
  steps:
    - name: Nhân viên gửi đơn
      actor: Nhân viên bán hàng
      nodes:
        - ui_action: CreateOrderComponent.submitOrder
        - api: POST /api/orders
      text: |
        Khi bấm Submit, [[CreateOrderComponent.submitOrder]] gọi
        [[OrderService.createOrder]] ...
    - name: Kiểm tra dòng đơn và tính tiền
      actor: Hệ thống
      nodes:
        - procedure: PKG_ORDER.VALIDATE_LINES
        - function: PKG_ORDER.CALCULATE_TOTAL
        - table: ORDER_DISCOUNT
      rules:
        - title: Dòng đơn phải hợp lệ trước khi tạo đơn
          at: PKG_ORDER.VALIDATE_LINES
          text: Thân procedure hiện chỉ có NULL...
  questions:
    - VALIDATE_LINES đang rỗng. Quy tắc kiểm tra gồm những gì?
`;
function modal(html) { const m = $("#modal"); m.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true">${html}</div>`; m.hidden = false; m.onclick = e => { if (e.target === m) m.hidden = true; }; m.querySelectorAll("[data-mclose]").forEach(b => b.addEventListener("click", () => { m.hidden = true; })); }
function openImport() {
  modal(`<h3>Import kết quả AI</h3><p>Dán YAML hoặc chọn file do AI xuất. Node được tham chiếu bằng <code>loại: tên</code>; hệ thống đối chiếu với graph trước khi áp dụng. Các phần bạn đã sửa tay hoặc đã duyệt không bị ghi đè.</p>
    <label class="btn" for="imp-file" style="justify-self:start">Chọn file .yaml</label><input id="imp-file" type="file" accept=".yaml,.yml" hidden>
    <textarea id="imp-text" spellcheck="false" aria-label="Nội dung YAML">${esc(SAMPLE_IMPORT)}</textarea><div id="imp-res"></div>
    <div class="modal-foot"><button type="button" class="btn" data-mclose>Đóng</button><button type="button" class="btn pri" id="imp-check">Kiểm tra</button></div>`);
  $("#imp-file").addEventListener("change", e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $("#imp-text").value = String(r.result); }; r.readAsText(f); });
  $("#imp-check").addEventListener("click", () => {
    let doc; const out = $("#imp-res");
    if (typeof jsyaml === "undefined") { out.innerHTML = `<div class="check"><div class="n">Không tải được thư viện đọc YAML.</div></div>`; return; }
    try { doc = jsyaml.load($("#imp-text").value); } catch (e) { out.innerHTML = `<div class="check"><div class="n">YAML sai cú pháp: ${esc(e.message.split("\n")[0])}</div></div>`; return; }
    const steps = doc?.flow?.steps || [], lines = [];
    steps.forEach(s => (s.nodes || []).forEach(ref => { const [k, v] = Object.entries(ref || {})[0] || []; lines.push([`${k}: ${v}`, !!byNm[String(v)]]); }));
    const ok = lines.filter(l => l[1]).length;
    out.innerHTML = `<div class="check"><strong style="font-size:13px">${steps.length} bước · ${ok}/${lines.length} node khớp graph</strong>${lines.map(([t, y]) => `<div class="${y ? "y" : "n"}">${y ? "✓" : "✕"} <code>${esc(t)}</code>${y ? "" : " · không có trong graph, sẽ lưu là mồ côi"}</div>`).join("")}</div>`;
  });
}
function openExport() {
  const data = { version: 1, flow: { id: FLOW.id, name: FLOW.name, domain: FLOW.domain, summary: FLOW.summary.text,
    steps: FLOW.steps.map(s => ({ name: s.name, actor: s.actor, status: s.prov, nodes: s.nodes.map(id => ({ [{ UI_ACTION: "ui_action", METHOD: "method", API_CALL_REFERENCE: "api_call", API_OPERATION: "api", PROCEDURE: "procedure", FUNCTION: "function", TABLE: "table", EXTERNAL_DATABASE_OBJECT: "external" }[byId[id].ty]]: byId[id].nm })),
      text: s.text, rules: s.rules.map(r => ({ title: r.title, at: r.at, text: r.text })) })),
    questions: FLOW.questions.map(q => q.a ? { q: q.q, answer: q.a } : q.q) } };
  const text = typeof jsyaml !== "undefined" ? jsyaml.dump(data, { lineWidth: 90 }) : JSON.stringify(data, null, 2);
  modal(`<h3>Xuất YAML</h3><p>Cùng định dạng với file import, gồm cả phần đã sửa tay và câu trả lời. Có thể lưu vào git để review.</p>
    <textarea readonly id="exp-text" aria-label="YAML xuất ra">${esc(text)}</textarea>
    <div class="modal-foot"><button type="button" class="btn" data-mclose>Đóng</button><button type="button" class="btn pri" id="exp-copy">Sao chép</button></div>`);
  $("#exp-copy").addEventListener("click", () => {
    const t = $("#exp-text");
    navigator.clipboard?.writeText(t.value).then(() => toast("Đã sao chép"), () => { t.select(); toast("Đã chọn nội dung, nhấn Ctrl+C để sao chép"); }) ?? (t.select(), toast("Đã chọn nội dung, nhấn Ctrl+C để sao chép"));
  });
}
$("#open-import").addEventListener("click", openImport);
let tt; function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => { el.hidden = true; }, 2200); }
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#modal").hidden = true; });

/* ======================= Boot ======================= */
function render() { S.view === "home" ? renderHome() : renderFlow(); }
$("#go-home").addEventListener("click", () => { S.view = "home"; render(); });
render();
</script>
