# Code Map pull request check: what this change does to the system, against the approved impact.yaml.
# Installed by `code-tree-exporter aidd init`. Needs .codemap/config.json (the extract config of this
# repository, with paths relative to it) and, for the comment, permission to write pull requests.
name: codemap

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

env:
  CODEMAP_TOOL_REPOSITORY: __CODEMAP_REPOSITORY__   # owner/code-map
  CODEMAP_TOOL_REF: main

jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CODEMAP_TOOL_REPOSITORY }}
          ref: ${{ env.CODEMAP_TOOL_REF }}
          path: .codemap-tool
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Install Code Map
        run: |
          python -m pip install -r .codemap-tool/requirements.txt
          npm ci --prefix .codemap-tool/extractor/code_tree_exporter/extractors/angular-extractor

      - name: Extract head and base
        env:
          PYTHONPATH: .codemap-tool/extractor
        run: |
          python -m code_tree_exporter extract --config .codemap/config.json --output "$RUNNER_TEMP/codemap-head"
          python -m code_tree_exporter extract --config .codemap/config.json \
            --at "origin/${{ github.base_ref }}" --output "$RUNNER_TEMP/codemap-base"

      - name: Find the approved impact analysis of this change
        id: plan
        run: |
          plan=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'docs/changes/*/impact.yaml' | head -n 1)
          echo "path=$plan" >> "$GITHUB_OUTPUT"

      - name: Diff
        env:
          PYTHONPATH: .codemap-tool/extractor
          PLAN: ${{ steps.plan.outputs.path }}
          # Optional: a copy of the team's knowledge.sqlite (rules and flow documents to re-check).
          KNOWLEDGE_DB: ${{ vars.CODEMAP_KNOWLEDGE_DB }}
        run: |
          args=(--base "$RUNNER_TEMP/codemap-base" --head "$RUNNER_TEMP/codemap-head" --out "$RUNNER_TEMP/codemap.md")
          [ -n "$PLAN" ] && args+=(--plan "$PLAN")
          [ -n "$KNOWLEDGE_DB" ] && [ -f "$KNOWLEDGE_DB" ] && args+=(--knowledge-db "$KNOWLEDGE_DB")
          python -m code_tree_exporter diff "${args[@]}"
          cat "$RUNNER_TEMP/codemap.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/codemap.md`, 'utf8');
            const marker = '<!-- codemap-diff -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
