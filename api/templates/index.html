<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title></title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1></h1>
        <input id="q" placeholder="Search table / package / procedure..." />
      </div>
      <div class="top-actions">
        <select id="schemaFilter" aria-label="Schema filter"><option>Schema: All</option></select>
        <div id="stats" class="stats"></div>
      </div>
    </header>

    <main class="shell">
      <aside class="roots">
        <div class="panel-head">
          <b>ROOT NODES</b>
        </div>
        <div id="rootList" class="root-list"></div>
      </aside>

      <section class="detail-panel">
        <div id="detail" class="empty">
          <h2>Select a table/package/procedure</h2>
          <p>Tables have two tabs: Table Definition and Relationship Flow.</p>
        </div>
      </section>
    </main>

    <script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
    <script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
    <script src="https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
